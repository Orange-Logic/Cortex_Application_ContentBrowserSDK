trigger:
  branches:
    include:
      - 'master'

resources:
  repositories:
    - repository: infra-templates
      type: git
      name: Infra_Pipelines-templates-dev
      ref: refs/tags/1.0.15

variables:
  - group: "Global Vars"

stages:
  - stage: Auto Tag
    dependsOn: []
    jobs:
      - job: Auto Tag
        displayName: 'Auto Tag'
        pool:
          name: VN Linux
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - template: azure-pipelines/common/steps-printenv.yml@infra-templates
          
          - bash: |
              echo "##vso[task.setvariable variable=tagVersion]$(awk 'f;/^# Change Log/{f=1}' README.md | grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1 | sed 's/^v//')"
            displayName: 'Set the tagVersion variable'
          - bash: |
              ticket=$(git show -s --format=%B "$(Build.SourceVersion)" | grep -Eo '[0-9]{2}[A-Z]{4}' | head -n1)
              ticket=${ticket:-a}
              prefix="$(tagVersion)-${ticket}-beta-"
              
              echo "Searching for tags matching pattern: ${prefix}*"
              
              # Get all matching tags from recent 10
              matching_tags=$(
                git for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags \
                | head -n 10 \
                | awk -v p="${prefix}" 'index($0, p) == 1 { print }'
              )
              
              if [ -z "${matching_tags}" ]; then
                echo "No existing tags found for this pattern"
                number=1
              else
                echo "Found matching tags:"
                echo "${matching_tags}"
                # Extract max number and increment
                number=$(
                  echo "${matching_tags}" \
                  | awk -v p="${prefix}" '{ n = substr($0, length(p) + 1); if (n ~ /^[0-9]+$/) print n }' \
                  | sort -nr \
                  | head -n1
                )
                number=$((number + 1))
                echo "Next beta number: ${number}"
              fi
              
              final_tag="${prefix}${number}"
              echo "Creating tag: ${final_tag}"
              echo "##vso[build.addbuildtag]${final_tag}"
            displayName: 'Check matching tags and add build tag'
          
          
          

          

